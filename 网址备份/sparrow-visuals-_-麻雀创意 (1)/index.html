
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparrow Visuals | 麻雀创意</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Montserrat:wght@800;900&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0A0A;
      --text: #EDEDED; /* Premium greyish white */
      --text-dim: #A0A0A0;
      --gray: #8E8E8E;
      --border: rgba(142, 142, 142, 0.12);
      --accent: #ffffff;
    }
    
    html { height: initial; scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      width: 100%;
      min-height: 100%;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Premium Typography Refinement */
    h1, h2, .text-h1, .text-h2 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .text-display {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(3rem, 15vw, 12rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .text-h1 {
      font-size: clamp(2rem, 6vw, 5rem);
      line-height: 1;
    }

    .text-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .text-body {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      line-height: 1.6;
      color: var(--text-dim);
    }

    /* Layout & UI */
    .border-fine { border: 0.5px solid var(--border); }
    
    .film-grain {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 9999;
      opacity: 0.04;
      background-image: url("https://grainy-gradients.vercel.app/noise.svg");
    }

    /* Progress Bar */
    #loader-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: var(--accent);
      z-index: 10000;
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--gray); }

    .vertical-text { writing-mode: vertical-rl; }

    /* Custom Navbar Typography overrides */
    nav .text-label {
      font-size: 14px;
      letter-spacing: 0.3em;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lenis": "https://esm.sh/lenis@1.1.20"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="loader-bar" style="width: 0%"></div>
  <div id="root"></div>
  <div class="film-grain"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
